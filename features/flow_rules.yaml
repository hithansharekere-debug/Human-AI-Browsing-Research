# Flow Rules and Packet Filtering Configuration
# Project: Human vs. AI-Agent Browsing at the Client Egress
# Role: Person B (Analysis Lead)
# Version: 1.1 (Updated with Person A Addendum 07 before Gate 2)

version: "1.1"

# Transport layer flow assembly settings (via nfstream or tshark fallback)
flow_reassembly:
  idle_timeout_seconds: 30.0     # Recommended in Handover §6 Step 0/4
  active_timeout_seconds: 1800.0 # Recommended in Handover §6 Step 0/4
  directionality: "bidirectional"
  include_layer7: false          # Pure egress transport layer; do not inspect deep payload strings

# Protocols in scope for human/agent web interaction
target_protocols:
  - name: "HTTPS"
    transport: "TCP"
    ports: [443, 8443]
  - name: "HTTP"
    transport: "TCP"
    ports: [80, 8080]
  - name: "QUIC_HTTP3"
    transport: "UDP"
    ports: [443]
  - name: "DNS"
    transport: "UDP"
    ports: [53, 853]
  - name: "DoT_DoH"
    transport: "TCP"
    ports: [853]

# ==============================================================================
# SECTION 1: LAN & LOCAL-ONLY TRAFFIC (EXCLUDE ENTIRELY BEFORE COMPUTING FLOWS)
# ==============================================================================
# These packets never traverse egress ISP routing. They must be dropped early
# so they never enter feature matrices or contaminate flow calculations.
lan_traffic_exclusions:
  # Hostnames, suffixes, and queries
  excluded_name_patterns:
    - "*.local"
    - "*._tcp.local"
    - "*._udp.local"
    - "android.local"              # Phone on same Wi-Fi in agent sessions S0005-S0019
    - "wpad.domain.name"           # Windows Web Proxy Auto-Discovery lookup
    - "_ldap._tcp.dc._msdcs.domain.name" # Windows Active Directory / domain query
    - "cal"                        # Single-label Windows local name query
  
  # IP broadcast / multicast / loopback ranges
  excluded_ip_ranges:
    - "192.168.1.255"              # Subnet broadcast
    - "255.255.255.255"            # Global broadcast
    - "224.0.0.0/4"                # IPv4 Multicast
    - "ff00::/8"                   # IPv6 Multicast
    - "127.0.0.0/8"                # IPv4 Loopback
    - "::1"                        # IPv6 Loopback
    - "192.0.2.1"                  # TEST-NET-1 (Experiment START/END markers, dropped after cut)

  # Local discovery protocol ports (mDNS, SSDP, LLMNR, NetBIOS/SMB)
  # NOTE: DHCP (67/68) and NTP (123) are NOT excluded here because neither is justified
  # in 07_ADDENDUM_more_background_domains.md or 00_READ_ME_FIRST_PersonB_Handover.pdf.
  excluded_ports:
    - protocol: "UDP"
      port: 5353                   # mDNS
      name: "mDNS"
    - protocol: "UDP"
      port: 1900                   # SSDP
      name: "SSDP"
    - protocol: "UDP"
      port: 5355                   # LLMNR
      name: "LLMNR"
    - protocol: "UDP"
      ports: [137, 138]            # NetBIOS Name / Datagram
      name: "NetBIOS_UDP"
    - protocol: "TCP"
      ports: [139, 445]            # NetBIOS Session / SMB
      name: "NetBIOS_SMB"

# ==============================================================================
# SECTION 2: FLOW CLASSIFICATION RULES & PRECEDENCE ORDER
# ==============================================================================
# Flow classification precedence (Handover §6 Step 5):
# 1. vendor (A)
# 2. search (D)
# 3. os_background
# 4. website
# default: unknown
flow_classification:
  match_order:
    - "vendor"
    - "search"
    - "os_background"
    - "website"
  default_class: "unknown"

  classes:
    # --------------------------------------------------------------------------
    # 1. VENDOR (Family A - Shortcut Family)
    # --------------------------------------------------------------------------
    vendor:
      description: "AI agent vendor endpoints and telemetry frameworks"
      domains:
        - "generativelanguage.googleapis.com"      # Google Gemini API
        - "http-intake.logs.us5.datadoghq.com"     # Agent framework telemetry
        - "*.datadoghq.com"

    # --------------------------------------------------------------------------
    # 2. SEARCH (Family D - Destination Shortcut / Omnibox Suggestions)
    # --------------------------------------------------------------------------
    search:
      description: "Browser omnibox search suggestion queries (human typing behavior)"
      domains:
        - "www.google.com"
        - "*.google.com"

    # --------------------------------------------------------------------------
    # 3. OS BACKGROUND (System & Desktop Telemetry, Personal Apps, Updates)
