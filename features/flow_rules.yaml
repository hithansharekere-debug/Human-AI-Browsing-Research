# ==============================================================================
# SECTION 3: UNRESOLVED DOMAINS (AUDIT PENDING POST-DECRYPTION)
# ==============================================================================
# In accordance with Addendum 07 §4, these domains MUST NOT be automatically
# assigned to website or os_background. They default to 'unknown' until raw
# NetLogs can be inspected at Gate 4.
unresolved_domains:
  - name: "fastly-edge.com"
    reason: "Wikipedia uses internal CDN; Vercel does not use Fastly. Unconfirmed if loaded by task or background."
    assigned_class: "unknown"
  - name: "cloudflare-ech.com"
    reason: "Cloudflare Encrypted Client Hello mechanism. Seen in D0010/D0012. Needs NetLog correlation."
    assigned_class: "unknown"

# ==============================================================================
# SECTION 4: SANITIZATION & LOGGING SAFEGUARDS
# ==============================================================================
sanitization:
  mask_source_ip: true
  mask_destination_ip: true
  endpoint_tokenization: "HMAC_SHA256"
  drop_payload_bytes: true
  max_retained_packet_header_bytes: 54
