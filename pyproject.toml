[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-ai-egress-analysis"
version = "0.1.0"
description = "Reproducible statistical analysis pipeline comparing human and AI-agent browsing at client egress"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary / Restricted Research"}
authors = [
    {name = "Person B (Analysis Lead)", email = "analysis-lead@research.local"}
]
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "scipy>=1.12.0,<2.0.0",
    "pyarrow>=15.0.0,<19.0.0",
    "nfstream>=6.5.3",
    "scikit-learn>=1.4.0,<2.0.0",
    "PyYAML>=6.0.1",
    "matplotlib>=3.8.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
